[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "course-compass"
version = "0.1.0"
description = "A study companion grounded in your own notes: cited answers, quizzes, spaced review."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Education",
]

[project.scripts]
course-compass = "course_compass.cli:main"

[tool.setuptools]
packages = ["course_compass"]
